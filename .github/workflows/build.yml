name: Archive resume PDFs

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to archive into output_pdfs/old/<year>'
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Archive PDFs for the requested year
        shell: pwsh
        run: ./archive-resume.ps1 -Year '${{ inputs.year }}'

      - name: Commit archived files if anything changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'No archive changes to commit.'
            exit 0
          }
          git commit -m "Archive resume PDFs for ${{ inputs.year }}"
          git push
