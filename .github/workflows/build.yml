name: Build resume PDF

on:
  push:
    branches:
      - master
    paths:
      - '2023_Resume.tex'
      - 'cv.tex'
      - 'references.tex'
      - 'friggeri-cv.cls'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '2023_Resume.tex'
      - 'cv.tex'
      - 'references.tex'
      - 'friggeri-cv.cls'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build 2023 resume with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: 2023_Resume.tex
          latexmk_use_xelatex: true

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: 2023_Resume.pdf
